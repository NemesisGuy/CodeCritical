name: Analyze Codebase

on:
  push:
    branches:
      - main

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    - name: Run analysis
      run: python -m codecritical.cli --path . --detect --output json --report-file codecritical-report.json
    - name: Upload report artifact
      uses: actions/upload-artifact@v3
      with:
        name: codecritical-report
        path: codecritical-report.json
